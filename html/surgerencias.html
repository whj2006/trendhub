<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="enviar surgerencias">
    <meta name="author" content="Hejun Wang">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title data-i18n-title="nav.sugerencias">Sugerencias</title>

    <base href="./">
    <link rel="icon" href="ic.png" type="image/png">
    <link rel="stylesheet" href="../css/surgerencias.css">
</head>

<body>
    <header class="header-principal">
        <div class="logo">
            <a href="principal.html">TrendHub</a>
        </div>

        <nav class="menu-navegacion">
            <ul>
            
                <li class="menu">
                    <a href="#" class="abrir" data-i18n="nav.explorar">Explorar ▾</a>
                    <div class="clasificacion">
                        <a href="musica.html" data-i18n="nav.musica">Música</a>
                        <a href="juego.html" data-i18n="nav.juegos">Juegos</a>
                        <a href="videos.html" data-i18n="nav.series">Series</a>
                        <a href="videos.html" data-i18n="nav.anime">Anime</a>
                        <a href="videos.html" data-i18n="nav.peliculas">Películas</a>
                    </div>
                </li>

                <li><a href="surgerencias.html" data-i18n="nav.sugerencias">Sugerencias</a></li>
            </ul>
        </nav>

        <section class="buscador" style="display:flex;align-items:center;">
            <button type="button" id="langToggle" onclick="toggleLang()" style="margin-left:8px;padding:6px 12px;cursor:pointer;border-radius:4px;border:1px solid #ccc;background:#fff;font-size:13px;font-weight:bold;">EN</button>
        </section>
    </header>

    <main>
        <form>
            
            <!-- DATOS PERSONALES -->
            <fieldset>
            <legend data-i18n="form.userData">Datos del usuario</legend>
            <table>
                <tr>
                    <td>
                        <label for="nombre" data-i18n="form.nombre">Nombre:</label>
                        <input type="text" id="nombre" placeholder="Tu nombre" data-i18n-placeholder="form.nombrePh">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="email" data-i18n="form.email">Email:</label>
                        <input type="email" id="email" placeholder="ejemplo@email.com" required>
                    </td>
                </tr>
            </table>
            </fieldset>

            <!--Tipo de contenido-->
            <fieldset>
            <legend data-i18n="form.whatSend">¿Qué quieres enviarnos?</legend>
            <table>
                <tr>
                    <td>
                        <input type="radio" id="recomendacion" name="categoria_principal" onclick="menuPrincipal('sugerencia')">
                        <label for="recomendacion" data-i18n="form.recomendacion">Recomendaciones de contenido</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="radio" id="bug" name="categoria_principal" onclick="menuPrincipal('error')">
                        <label for="bug" data-i18n="form.reportar">Reportar un Error</label>
                    </td>
                </tr>
            </table> 
            </fieldset>

            <!--Tipo de error-->
            <fieldset id="tipoError" style="display: none;">
            <legend data-i18n="form.tipoError">Tipo de error</legend>
            <table>
               <tr>
                    <td>
                        <input type="radio" id="err_menu" name="lugar_error" value="menu">
                        <label for="err_menu" data-i18n="form.enMenu">En el menú</label>
                    </td>
                    <td>
                        <input type="radio" id="err_form" name="lugar_error" value="form">
                        <label for="err_form" data-i18n="form.enForm">En el formulario</label>
                    </td>
                    <td>
                        <input type="radio" id="err_cont" name="lugar_error" value="contenido">
                        <label for="err_cont" data-i18n="form.enContenido">En el contenido</label>
                    </td>
                    <td>
                        <input type="radio" id="err_otro" name="lugar_error" value="otro">
                        <label for="err_otro" data-i18n="form.otro">Otro</label>
                    </td>
                </tr>
            </table>
            </fieldset>

            <!--detalle del error-->
            <fieldset id="detalleError" style="display: none;">
            <legend data-i18n="form.detalleError">Detalle de error</legend>
            <table>
                <tr>
                    <td>
                        <label for="tituloE" data-i18n="form.titulo">Título:</label>
                        <input type="text" id="tituloE" placeholder="Error" data-i18n-placeholder="form.tituloEPh" required>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="mensajeE" data-i18n="form.quePasa">¿Qué pasa?</label>
                        <textarea id="mensajeE" placeholder="Explica el error que encontraste" data-i18n-placeholder="form.explicaError" required></textarea>
                    </td>
                </tr>
            </table> 
            </fieldset>

            <!-- Tipo de contenido -->
            <fieldset  id="tipoSugerencias" style="display: none;">
            <legend data-i18n="form.sugerenciaSobre">¿Sobre qué es tu sugerencia?</legend>
                <table>
                    <tr>
                        <td>
                            <input type="radio" id="musica" name="tipo" value="musica" onclick="mostrarGenero('generoMusica')">
                            <label for="musica" data-i18n="nav.musica">Música</label>
                        </td>
                        <td>
                            <input type="radio" id="pelicula" name="tipo" value="pelicula" onclick="mostrarGenero('generoVideo')">
                            <label for="pelicula" data-i18n="type.pelicula">Película</label>
                        </td>
                        <td>
                            <input type="radio" id="serie" name="tipo" value="serie" onclick="mostrarGenero('generoVideo')">
                            <label for="serie" data-i18n="type.serie">Serie</label>
                        </td>
                        <td>
                            <input type="radio" id="anime" name="tipo" value="anime" onclick="mostrarGenero('generoVideo')">
                            <label for="anime" data-i18n="type.anime">Anime</label>
                        </td>
                        <td>
                            <input type="radio" id="juego" name="tipo" value="juego" onclick="mostrarGenero('generoJuego')">
                            <label for="juego" data-i18n="nav.juegos">Juego</label>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <!-- Detalles del contenido -->
            <fieldset id="detalleSugerencias" style="display: none;">
            <legend data-i18n="form.detalles">Detalles</legend>
            <table>
                
                <!--genero de videos-->
                <tr id="generoVideo" style="display: none;">
                    <td>
                        <label for="generoV" data-i18n="form.genero">Género:</label><br>
                        <select id="generoV" name="generoV">
                            <option data-i18n="genre.accion">Acción</option>
                            <option data-i18n="genre.comedia">Comedia</option>
                            <option data-i18n="genre.drama">Drama</option>
                            <option data-i18n="genre.terror">Terror</option>
                            <option data-i18n="genre.romance">Romance</option>
                            <option data-i18n="genre.fantasia">Fantasía</option>
                            <option data-i18n="genre.ciencia ficcion">Ciencia ficción</option>
                            <option data-i18n="genre.crimen">Crimen</option>
                        </select>
                    </td>
                </tr>

                <tr id="generoMusica" style="display: none;">
                    <td>
                        <label for="generoM" data-i18n="form.genero">Género:</label><br>
                        <select id="generoM" name="generoM">
                            <option data-i18n="genre.rock">Rock</option>
                            <option data-i18n="genre.pop">Pop</option>
                            <option data-i18n="genre.hip-pop">Hip-Hop</option>
                            <option data-i18n="genre.trap">Trap</option>
                            <option data-i18n="genre.regueton">Reguetón</option>
                            <option data-i18n="genre.r&b">R&B</option>
                            <option data-i18n="genre.blue">Blues</option>
                            <option data-i18n="genre.jazz">Jazz</option>
                            <option data-i18n="genre.clasico">Clásico</option>
                        </select>
                    </td>
                </tr>

                <tr id="generoJuego" style="display: none;">
                    <td>
                        <label for="generoJ" data-i18n="form.genero">Género:</label><br>
                        <select id="generoJ" name="generoJ">
                            <option data-i18n="genre.fps">FPS</option>
                            <option data-i18n="genre.moba">MOBA</option>
                            <option data-i18n="genre.rpg">RPG</option>
                            <option data-i18n="genre.battle royale">Battle Royale</option>
                            <option data-i18n="genre.sandbox">Sandbox</option>
                            <option data-i18n="genre.horror">Horror</option>
                            <option data-i18n="genre.deportes">Deportes</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="tituloR" data-i18n="form.tituloR">Título:</label>
                        <input type="text" id="tituloR" placeholder="Nombre del contenido" data-i18n-placeholder="form.nombreContenido" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="mensajeR" data-i18n="form.porQue">¿Por qué?</label>
                        <textarea id="mensajeR" placeholder="Explica tu recomendación..." data-i18n-placeholder="form.explicaRec" required></textarea>
                    </td>
                </tr>
            </table>
            </fieldset>

            <!-- ENVÍO -->
            <p>
                <input type="checkbox" id="aceptar" required>
                <label for="aceptar" data-i18n="form.acepto">Acepto enviar la sugerencia</label>
            </p>

            <p>
                <input type="submit" data-i18n-value="form.enviar" value="Enviar sugerencia">
                <input type="reset" data-i18n-value="form.reset" value="Resetear" onclick="resetGeneros()">
            </p>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Hejun Wang</p>
    </footer>
    <script src="../js/i18n.js"></script>
    <script src="../js/surgerencias.js"></script>
    <script src="../js/buscador.js"></script>
</body>
</html>
