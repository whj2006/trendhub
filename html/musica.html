<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="recomendaciones musica">
    <meta name="keywords" content="musica">
    <meta name="author" content="Hejun Wang">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Recomendacion musica</title>

    <base href="./">
    <link rel="stylesheet" href="../css/musica.css">
    <link rel="stylesheet" href="../css/reset.css">
</head>

<body>

    <header class="header-principal">
        <div class="logo">
            <a href="principal.html">TrendHub</a>
        </div>

        <nav class="menu-navegacion">
            <ul>
            
                <li class="menu">
                    <a href="#" class="abrir">Explorar ▾</a>
                    <div class="clasificacion">
                        <a href="musica.html">Música</a>
                        <a href="juego.html">Juegos</a>
                        <a href="videos.html">Series</a>
                        <a href="videos.html">Anime</a>
                        <a href="videos.html">Películas</a>
                    </div>
                </li>

                <li><a href="surgerencias.html">Sugerencias</a></li>
            </ul>
        </nav>

        <section class="buscador">
            <input type="text" id="textoBuscar" placeholder="Escribe aquí...">
            <button type="button" class="texto">BUSCAR</button>
        </section>
    </header>

    <main>
        <section class="filtros">

            <div>
                <p>Género</p>

                <button class="tag" data-genero="todos">Todos</button>
                <button class="tag" data-genero="rock">Rock</button>
                <button class="tag" data-genero="pop">Pop</button>
                <button class="tag" data-genero="hip-hop">Hip-Hop</button>
                <button class="tag" data-genero="trap">Trap</button>
                <button class="tag" data-genero="regueton">Reguetón</button>
                <button class="tag" data-genero="r&b">R&B</button>
                <button class="tag" data-genero="blues">Blues</button>
                <button class="tag" data-genero="jazz">Jazz</button>
                <button class="tag" data-genero="clasico">Clásico</button>

            </div>

            <div>
                <p>Año</p>

                <button class="tag" data-ano="todos">Todos</button>
                <button class="tag" data-ano="2020">2020+</button>
                <button class="tag" data-ano="2010">2010+</button>
                <button class="tag" data-ano="antes">Más viejas</button>

            </div>

        </section>
        <section id="contenedor">

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Hejun Wang</p>
        <script src="../js/datos.js"></script>
        <script src="../js/musica.js"></script>
        <script src="../js/buscador.js"></script>
    </footer>

</body>
</html>
