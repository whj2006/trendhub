<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="recomendaciones video">
    <meta name="keywords" content="video">
    <meta name="author" content="Hejun Wang">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title data-i18n-title="nav.series">Series</title>

    <base href="./">
    <link rel="stylesheet" href="../css/videos.css">
    <link rel="stylesheet" href="../css/reset.css">
</head>


<body>

    <header class="header-principal">
        <div class="logo">
            <a href="principal.html">TrendHub</a>
        </div>

        <nav class="menu-navegacion">
            <ul>
            
                <li class="menu">
                    <a href="javascript:void(0)" class="abrir" data-i18n="nav.explorar">Explorar ▾</a>
                    <div class="clasificacion">
                        <a href="musica.html" data-i18n="nav.musica">Música</a>
                        <a href="juego.html" data-i18n="nav.juegos">Juegos</a>
                        <a href="videos.html" data-i18n="nav.series">Series</a>
                        <a href="videos.html" data-i18n="nav.anime">Anime</a>
                        <a href="videos.html" data-i18n="nav.peliculas">Películas</a>
                    </div>
                </li>

                <li><a href="surgerencias.html" data-i18n="nav.sugerencias">Sugerencias</a></li>
            </ul>
        </nav>

        <section class="buscador">
            <input type="text" id="textoBuscar" placeholder="Escribe aquí..." data-i18n-placeholder="nav.placeholder">
            <button type="button" class="texto" data-i18n="nav.buscar">BUSCAR</button>
            <button type="button" id="langToggle" onclick="toggleLang()" style="margin-left:8px;padding:6px 12px;cursor:pointer;border-radius:4px;border:1px solid #ccc;background:#fff;font-size:13px;font-weight:bold;">EN</button>
        </section>
    </header>

    <main>
        <section class="filtros">

            <div>
                <p data-i18n="filter.tipo">Tipo</p>
                <button class="tag active" data-tipo="todos" data-i18n="filter.todos">Todos</button>
                <button class="tag" data-tipo="pelicula" data-i18n="type.pelicula">Película</button>
                <button class="tag" data-tipo="serie" data-i18n="type.serie">Serie</button>
                <button class="tag" data-tipo="anime" data-i18n="type.anime">Anime</button>
            </div>

            <div>
                <p data-i18n="filter.genero">Género</p>
                <button class="tag active" data-genero="todos" data-i18n="filter.todos">Todos</button>
                <button class="tag" data-genero="accion" data-i18n="genre.accion">Acción</button>
                <button class="tag" data-genero="comedia" data-i18n="genre.comedia">Comedia</button>
                <button class="tag" data-genero="drama" data-i18n="genre.drama">Drama</button>
                <button class="tag" data-genero="terror" data-i18n="genre.terror">Terror</button>
                <button class="tag" data-genero="romance" data-i18n="genre.romance">Romance</button>
                <button class="tag" data-genero="fantasia" data-i18n="genre.fantasia">Fantasía</button>
                <button class="tag" data-genero="ciencia ficcion" data-i18n="genre.ciencia ficcion">Ciencia ficción</button>
                <button class="tag" data-genero="crimen" data-i18n="genre.crimen">Crimen</button>
            </div>

            <div>
                <p data-i18n="filter.ano">Año</p>
                <button class="tag active" data-ano="todos" data-i18n="filter.todos">Todos</button>
                <button class="tag" data-ano="2020">2020+</button>
                <button class="tag" data-ano="2010">2010+</button>
                <button class="tag" data-ano="2000">2000+</button>
                <button class="tag" data-ano="antes" data-i18n="filter.masViejas">Más viejas</button>
            </div>
        </section>

        <section id="contenedor">

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Hejun Wang</p>
        <script src="../js/i18n.js"></script>
        <script src="../js/datos.js"></script>
        <script src="../js/video.js"></script>
        <script src="../js/buscador.js"></script>
    </footer>

</body>
</html>
